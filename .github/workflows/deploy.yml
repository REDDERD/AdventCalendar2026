name: Test and deploy

# Push to main = live on GitHub Pages (Section 13.1).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm install -g firebase-tools@15

      - name: Lint (types + content:lint)
        run: npm run lint

      - name: Content simulation (paths, length)
        run: npm run content:simulate

      - name: Puzzles solvable [PLAN-3]
        run: npm run puzzles:verify

      - name: Asset licences [GFX-3]
        run: npm run assets:check

      - name: Unit tests
        run: npm test

      - name: Security rules tests [SEC-1]
        run: npm run test:rules

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
